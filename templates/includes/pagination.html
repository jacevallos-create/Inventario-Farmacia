{% if pagina.paginator.num_pages > 1 %}<nav class="pagination">{% if pagina.has_previous %}<a href="?q={{ q }}&page={{ pagina.previous_page_number }}">← Anterior</a>{% endif %}<span>Página {{ pagina.number }} de {{ pagina.paginator.num_pages }}</span>{% if pagina.has_next %}<a href="?q={{ q }}&page={{ pagina.next_page_number }}">Siguiente →</a>{% endif %}</nav>{% endif %}
